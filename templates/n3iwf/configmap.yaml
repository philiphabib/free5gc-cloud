apiVersion: v1
kind: ConfigMap
metadata:
  name: n3iwf-config
  namespace: {{ .Values.global.namespace }}
data:
  n3iwfcfg.yaml: |
    info:
      version: 1.0.5
      description: N3IWF initial local configuration

    configuration:
      N3IWFInformation:
        GlobalN3IWFID:
          PLMNID:
            MCC: 208
            MNC: 93
          N3IWFID: 135
        Name: free5GC_N3IWF
        SupportedTAList:
          - TAC: 000001
            BroadcastPLMNList:
              - PLMNID:
                  MCC: 208
                  MNC: 93
                TAISliceSupportList:
                  - SNSSAI:
                      SST: 1
                      SD: 010203

      AMFSCTPAddresses:
        - IP: 10.108.147.110
      NASTCPPort: 20000

      IKEBindAddress: 192.168.122.231
      IPSecTunnelAddress: 10.200.200.1
      UEIPAddressRange: 10.200.200.0/24

      GTPBindAddress: 192.168.122.232
      FQDN: n3iwf.free5gc.org

      LivenessCheck:
        enable: true
        transFreq: 60s
        maxRetryTimes: 4

      Cert:
        PEM: cert/n3iwf.pem
        Key: cert/n3iwf.key

    logger:
      enable: true
      level: info
      reportCaller: false
