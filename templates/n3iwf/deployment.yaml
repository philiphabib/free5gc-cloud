apiVersion: apps/v1
kind: Deployment
metadata:
  name: n3iwf
  namespace: {{ .Values.global.namespace }}
  labels:
    app: free5gc-n3iwf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: free5gc-n3iwf
  template:
    metadata:
      labels:
        app: free5gc-n3iwf
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"n3iwf-nwu","ips":["192.168.122.231/24"]}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
        - name: n3iwf
          image: "free5gc/n3iwf:v4.1.0"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              ip link del ipsec0 2>/dev/null || true
              ip link add ipsec0 type vti local 192.168.122.231 remote 0.0.0.0 key 5
              ip addr add 10.200.200.1/24 dev ipsec0 2>/dev/null || true
              ip link set dev ipsec0 up
              exec ./n3iwf -c ./config/n3iwfcfg.yaml
          # ▼▼▼ REMOVE THE command: BLOCK ENTIRELY ▼▼▼
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - name: ike
              containerPort: 500
              protocol: UDP
            - name: ike-natt
              containerPort: 4500
              protocol: UDP
            - name: gtpu
              containerPort: 2152
              protocol: UDP
          volumeMounts:
            - name: n3iwf-config
              mountPath: /free5gc/config/n3iwfcfg.yaml
              subPath: n3iwfcfg.yaml
              readOnly: true
            - name: n3iwf-certs
              mountPath: /free5gc/cert
              readOnly: true
      volumes:
        - name: n3iwf-config
          configMap:
            name: n3iwf-config
        - name: n3iwf-certs
          secret:
            secretName: n3iwf-certs
