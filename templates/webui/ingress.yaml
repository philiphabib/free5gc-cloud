{{- if .Values.webui.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: free5gc-webui
  namespace: {{ .Values.global.namespace }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.webui.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webui
            port:
              number: 5000
{{- end }}
