apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcf
  namespace: {{ .Release.Namespace }}
  labels:
    app: free5gc-pcf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: free5gc-pcf
  template:
    metadata:
      labels:
        app: free5gc-pcf
    spec:
      containers:
        - name: pcf
          image: free5gc/pcf:v4.2.3
          imagePullPolicy: IfNotPresent
          command:
            - ./pcf
            - -c
            - ./config/pcfcfg.yaml
          ports:
            - name: sbi
              containerPort: 8000
              protocol: TCP
          env:
            - name: GIN_MODE
              value: release
          volumeMounts:
            - name: config
              mountPath: /free5gc/config/pcfcfg.yaml
              subPath: pcfcfg.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: pcf-config
