apiVersion: apps/v1
kind: Deployment
metadata:
  name: upf
  namespace: {{ .Release.Namespace }}
  labels:
    app: free5gc-upf
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: free5gc-upf

  template:
    metadata:
      labels:
        app: free5gc-upf
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"upf-n3","ips":["192.168.122.232/24"]}]'

    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1

      # Runs before the UPF starts, in the same network namespace:
      # enables IP forwarding and NATs UE traffic (10.60.0.0/16) out of the pod.
      initContainers:
        - name: upf-net-init
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache iptables
              sysctl -w net.ipv4.ip_forward=1
              iptables -t nat -C POSTROUTING -s 10.60.0.0/16 ! -o upfgtp -j MASQUERADE 2>/dev/null || \
                iptables -t nat -A POSTROUTING -s 10.60.0.0/16 ! -o upfgtp -j MASQUERADE
              iptables -t nat -S POSTROUTING

      containers:
        - name: upf
          image: "{{ .Values.image.registry }}/upf:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - ./upf
            - -c
            - ./config/upfcfg.yaml

          securityContext:
            privileged: true

          ports:
            - name: pfcp
              containerPort: 8805
              protocol: UDP

            - name: gtpu
              containerPort: 2152
              protocol: UDP

          volumeMounts:
            - name: upf-config
              mountPath: /free5gc/config/upfcfg.yaml
              subPath: upfcfg.yaml
              readOnly: true

            - name: dev-net-tun
              mountPath: /dev/net/tun

      volumes:
        - name: upf-config
          configMap:
            name: upf-config

        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
